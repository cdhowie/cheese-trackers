[package]
name = "cheese-trackers-server"
version = "0.1.0"
edition = "2024"

[features]
default = ["postgres"]
postgres = [
    "sea-query/backend-postgres",
    "sea-query-sqlx/sqlx-postgres",
    "sqlx/postgres",
]

[profile.release]
strip = "symbols"
lto = "fat"

[dependencies]
arrayvec = "0.7.4"
async-stream = "0.3.5"
axum = "0.8.3"
axum-client-ip = "1.0.0"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base64 = "0.23.1"
bytes = "1.11.1"
chacha20poly1305 = "0.11.0"
cheese-trackers-server-macros = { version = "0.1.0", path = "../server-macros" }
chrono = { version = "0.4.33", features = ["serde"] }
config = "0.15.7"
futures = "0.3.30"
ipnetwork = { version = "0.21.1", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
moka = { version = "0.12.5", features = ["future"] }
oauth2 = "4.4.2"
paste = "1.0.14"
reqwest = { version = "0.13.2", features = ["json"] }
scraper = "0.27.0"
sea-query = { version = "1.0.2", default-features = false, features = [
    "derive",
    "sea-query-derive",
    "attr",
    "with-chrono",
    "with-ipnetwork",
    "with-uuid",
] }
sea-query-sqlx = { version = "0.9.1", features = [
    "sqlx-postgres",
    "with-chrono",
    "with-ipnetwork",
    "with-uuid",
] }
serde = { version = "1.0.196", features = ["derive"] }
serde_cow = "0.1.2"
serde_json = "1.0.117"
serenity = "0.12.0"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "ipnetwork",
    "runtime-tokio",
] }
thiserror = "2.0.11"
tokio = { version = "1.36.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tower-layer = "0.3.2"
url = { version = "2.5.0", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
yaml-split = "0.4.0"
yaml_serde = "0.10.4"
zip = { version = "9.0.4", default-features = false, features = [
    "deflate",
    "deflate64",
    "lzma",
    "ppmd",
    "xz",
    "zstd",
    "bzip2",
] }
